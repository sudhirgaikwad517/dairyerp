<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Akash Dairy Farm: order milk, see bills and claims.">
  <meta name="theme-color" content="#0B2545">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Akash Dairy">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Akash Dairy Farm</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; height: 100%; background: #EEF3F2; }
    #splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
              gap: 18px; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #0B2545; }
    #splash img { width: 96px; height: 96px; }
    #splash .bar { width: 120px; height: 4px; border-radius: 2px; background: #D7E3EA; overflow: hidden; }
    #splash .bar::after { content: ""; display: block; width: 40%; height: 100%; background: #13406B; border-radius: 2px;
                          animation: load 1.1s ease-in-out infinite; }
    @keyframes load { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
  </style>
</head>
<body>
  <div id="splash"><img src="icons/Icon-192.png" alt=""><b>Akash Dairy Farm</b><div class="bar"></div></div>
  <script>
    // Remove the loading screen once Flutter draws its first frame
    window.addEventListener('flutter-first-frame', () => document.getElementById('splash')?.remove());
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
