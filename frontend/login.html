<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b2545">
  <title>Login | Akash Dairy Farm</title>
  <link rel="icon" type="image/png" href="/frontend/assets/favicon.png">
  <link rel="apple-touch-icon" href="/frontend/assets/apple-touch-icon.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/frontend/css/styles.css?v=20261022d">
  <style>
    body { background: #eef3f7; }
    .login-shell { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
    .login-box { width: 100%; max-width: 920px; display: flex; background: #fff; border-radius: 24px; overflow: hidden; box-shadow: 0 24px 60px -20px rgba(11, 37, 69, 0.35); }
    .login-side {
      flex: 1 1 46%; color: #fff; padding: 40px 36px; position: relative; overflow: hidden;
      background: linear-gradient(150deg, #0b2545 0%, #13406b 55%, #0e7fb5 100%);
      display: flex; flex-direction: column;
    }
    .login-side::after {
      content: ''; position: absolute; right: -80px; bottom: -80px; width: 260px; height: 260px; border-radius: 50%;
      background: rgba(255, 255, 255, 0.06);
    }
    .login-side .ls-brand { font-weight: 800; font-size: 1.5rem; letter-spacing: -0.02em; margin-top: 18px; }
    .login-side .ls-tag { color: rgba(255, 255, 255, 0.75); font-size: 0.92rem; }
    .login-side .ls-app { margin-top: auto; padding-top: 32px; }
    .login-side .ls-app-title { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 700; color: rgba(255, 255, 255, 0.65); }
    .login-side ul { list-style: none; padding: 0; margin: 12px 0 0; }
    .login-side li { display: flex; gap: 10px; align-items: flex-start; font-size: 0.9rem; margin-bottom: 10px; color: rgba(255, 255, 255, 0.92); }
    .login-side li i { color: #7ce0ae; }
    .login-form-side { flex: 1 1 54%; padding: 44px 40px; }
    .login-form-side h1 { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.02em; color: #0f172a; }
    .login-form-side .form-control { padding: 11px 14px; }
    .login-form-side .input-group-text { border-radius: 12px 0 0 12px; background: #f8fafc; color: #64748b; }
    .login-form-side #login-username { border-radius: 0 12px 12px 0; }
    .login-form-side #login-password { border-radius: 0; }
    .login-form-side #toggle-password { border-radius: 0 12px 12px 0; }
    #login-btn { padding: 12px; border-radius: 12px; font-weight: 700; }
    .app-switch a { font-size: 0.82rem; text-decoration: none; font-weight: 600; color: #13406b; padding: 6px 12px; border-radius: 999px; background: #eef3f7; }
    .app-switch a:hover { background: #e0f2fe; }
    .mobile-brand { display: none; }
    @media (max-width: 767.98px) {
      .login-shell { align-items: flex-start; padding: 0; }
      .login-box { flex-direction: column; border-radius: 0; box-shadow: none; min-height: 100vh; background: #eef3f7; }
      .login-side { display: none; }
      .mobile-brand {
        display: block; text-align: center; color: #fff; padding: 36px 20px 64px;
        background: linear-gradient(150deg, #0b2545 0%, #13406b 55%, #0e7fb5 100%);
      }
      .mobile-brand .mb-name { font-weight: 800; font-size: 1.35rem; margin-top: 12px; }
      .mobile-brand .mb-app { font-size: 0.85rem; color: rgba(255, 255, 255, 0.75); }
      .login-form-side { padding: 28px 20px; margin: -40px 16px 16px; background: #fff; border-radius: 20px; box-shadow: 0 12px 30px -12px rgba(11, 37, 69, 0.3); flex: 0 0 auto; }
    }
  </style>
  <script>
    // Which app this login is for: admin (default), driver or customer
    window.DAIRY_APP = (['admin', 'driver', 'customer'].includes(new URLSearchParams(location.search).get('app'))
      ? new URLSearchParams(location.search).get('app') : 'admin');
  </script>
</head>
<body class="light-page">
  <div class="login-shell">
    <div class="login-box">
      <!-- Brand panel (desktop) -->
      <aside class="login-side">
        <img src="/frontend/assets/logo-192.png" class="brand-logo lg" alt="Akash Dairy Farm logo">
        <div class="ls-brand">Akash Dairy Farm</div>
        <div class="ls-tag">Fresh milk, delivered every morning.</div>
        <div class="ls-app">
          <div class="ls-app-title" id="side-app-title"></div>
          <ul id="side-points"></ul>
        </div>
      </aside>

      <!-- Brand header (phone) -->
      <div class="mobile-brand">
        <img src="/frontend/assets/logo-192.png" class="brand-logo lg mx-auto" alt="Akash Dairy Farm logo">
        <div class="mb-name">Akash Dairy Farm</div>
        <div class="mb-app" id="mobile-app-title"></div>
      </div>

      <!-- Form -->
      <section class="login-form-side">
        <h1 class="mb-1">Welcome back</h1>
        <div class="text-muted small mb-4" id="login-subtitle"></div>

        <form id="login-form" novalidate>
          <div class="mb-3">
            <label class="form-label small fw-bold text-muted" for="login-username" id="login-username-label">Mobile number</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-person" id="login-username-icon"></i></span>
              <input type="text" id="login-username" class="form-control form-dairy-control" autocomplete="username" required autofocus>
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label small fw-bold text-muted" for="login-password">Password</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-lock"></i></span>
              <input type="password" id="login-password" class="form-control form-dairy-control" autocomplete="current-password" required>
              <button type="button" class="btn btn-dairy-secondary" id="toggle-password" aria-label="Show password">
                <i class="bi bi-eye"></i>
              </button>
            </div>
          </div>
          <div class="alert alert-danger py-2 small d-none" id="login-error" role="alert"></div>
          <button type="submit" class="btn btn-dairy-primary w-100" id="login-btn">Log In</button>
        </form>

        <p class="text-muted small text-center mt-3 mb-0" id="login-help"></p>
        <hr class="my-4">
        <div class="text-center small text-muted mb-2">Other logins</div>
        <div class="app-switch text-center d-flex justify-content-center flex-wrap gap-2" id="app-switch"></div>
      </section>
    </div>
  </div>
  <div class="dev-credit-corner"><a class="dev-credit" href="/privacy" target="_blank">Privacy Policy</a> · <a class="dev-credit" href="/terms" target="_blank">Terms</a> · <a class="dev-credit" href="https://www.prowexa.com" target="_blank" rel="noopener">Design Developed By <b>Prowexa Technologies Pvt. Ltd</b></a></div>

  <script src="/frontend/js/api.js?v=20261022d"></script>
  <script>
    const APPS = {
      admin: { title: 'Admin Panel', label: 'Username or mobile number', home: '/', icon: 'person-badge',
               placeholder: 'Your username', help: 'For the dairy owner and office staff.',
               points: ['Daily orders and dispatch', 'Bills, payments and claims', 'Sales and transport reports'] },
      driver: { title: 'Delivery App', label: 'Mobile number', home: '/driver', icon: 'phone',
                placeholder: '10-digit mobile number', help: 'Forgot password? Ask the dairy admin to reset it.',
                points: ["Today's delivery stops in order", 'Photo and signature for every delivery', 'Record cash / UPI collected'] },
      customer: { title: 'Customer Portal', label: 'Mobile number', home: '/customer', icon: 'phone',
                  placeholder: '10-digit mobile number', help: 'Forgot password? Call the dairy to reset it.',
                  points: ['Order milk for the next 7 days', 'See your bills and download PDFs', 'Check your account balance'] },
    };
    const cfg = APPS[DAIRY_APP];
    document.title = `${cfg.title} Login | Akash Dairy Farm`;
    document.getElementById('login-subtitle').innerText = `Log in to the ${cfg.title}`;
    document.getElementById('side-app-title').innerText = cfg.title;
    document.getElementById('mobile-app-title').innerText = cfg.title;
    document.getElementById('side-points').innerHTML = cfg.points
      .map(p => `<li><i class="bi bi-check-circle-fill"></i><span>${p}</span></li>`).join('');
    document.getElementById('login-username-label').innerText = cfg.label;
    document.getElementById('login-username').placeholder = cfg.placeholder;
    document.getElementById('login-username-icon').className = `bi bi-${cfg.icon}`;
    if (DAIRY_APP !== 'admin') document.getElementById('login-username').inputMode = 'tel';
    document.getElementById('login-help').innerText = cfg.help;
    document.getElementById('app-switch').innerHTML = Object.entries(APPS)
      .filter(([key]) => key !== DAIRY_APP)
      .map(([key, a]) => `<a href="/login?app=${key}">${a.title}</a>`).join('');

    // Already logged in to this app: go straight in
    if (Auth.token()) window.location.replace(cfg.home);

    document.getElementById('toggle-password').addEventListener('click', () => {
      const input = document.getElementById('login-password');
      const show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      document.querySelector('#toggle-password i').className = show ? 'bi bi-eye-slash' : 'bi bi-eye';
    });

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('login-username').value.trim();
      const password = document.getElementById('login-password').value;
      const errorEl = document.getElementById('login-error');
      const btn = document.getElementById('login-btn');
      errorEl.classList.add('d-none');
      if (!username || !password) {
        errorEl.innerText = 'Enter your login and password.';
        errorEl.classList.remove('d-none');
        return;
      }
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> Logging in...';
      try {
        const res = await DairyAPI.login(username, password);
        Auth.save(res);
        window.location.replace(cfg.home);
      } catch (err) {
        errorEl.innerText = err.message;
        errorEl.classList.remove('d-none');
        btn.disabled = false;
        btn.innerText = 'Log In';
      }
    });
  </script>
</body>
</html>
